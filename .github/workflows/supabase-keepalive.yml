# Mantiene activo el proyecto Supabase de GastoTrack.
# Supabase (plan free) pausa el proyecto tras ~7 días sin actividad;
# este workflow hace una consulta cada 3 días para que nunca llegue a eso.
#
# Ubicación en el repo:  .github/workflows/supabase-keepalive.yml
# Secrets necesarios (Settings → Secrets and variables → Actions):
#   SUPABASE_URL       → https://gwjzhvrviztsizgusmou.supabase.co
#   SUPABASE_ANON_KEY  → la anon key (la misma del HTML)

name: Supabase keepalive

on:
  schedule:
    - cron: '17 12 */3 * *'   # cada 3 días, 12:17 UTC (09:17 en Argentina)
  workflow_dispatch:           # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write              # solo para el heartbeat de abajo

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping a Supabase (lectura liviana de la tabla gastos)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e
          for intento in 1 2 3; do
            code=$(curl -s -o resp.json -w '%{http_code}' \
              "$SUPABASE_URL/rest/v1/gastos?select=id&limit=1" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY")
            echo "Intento $intento → HTTP $code"
            if [ "$code" = "200" ]; then echo "Supabase activo ✔"; exit 0; fi
            sleep 20
          done
          echo "Supabase no respondió 200:"; cat resp.json
          exit 1

      # GitHub desactiva los workflows programados si el repo pasa 60 días
      # sin commits. Si el último commit tiene más de 45 días, dejamos uno
      # automático para que el keepalive nunca se apague solo.
      - uses: actions/checkout@v4
      - name: Heartbeat del repo (solo si hace falta)
        run: |
          ultimo=$(git log -1 --format=%ct)
          dias=$(( ( $(date +%s) - ultimo ) / 86400 ))
          echo "Días desde el último commit: $dias"
          if [ "$dias" -ge 45 ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive-heartbeat.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/keepalive-heartbeat.txt
            git commit -m "chore: keepalive heartbeat"
            git push
          fi
